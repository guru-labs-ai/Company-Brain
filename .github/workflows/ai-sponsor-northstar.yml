# Posts the AI Sponsor north star nudge into Slack #ai-sponsor every Friday.
#
# Matt asked for this so the counter comes to him rather than him having to
# remember to go and look.
#
# ⛔ THIS IS A POINTER, NOT A REPORT. That is deliberate and it is Mariam's
# call. It states no figures. The dashboard is live and updates itself, so the
# numbers belong there and the post exists only to send people to it. Keep it
# to the two lines below. It runs every week and anything extra becomes noise
# by the third one.
#
# A richer version that fetched and posted the actual metrics lived here
# briefly and is in git history if it is ever wanted back. It was dropped
# because it turned a one line nudge into a weekly report nobody asked for,
# and because fetching numbers made the post depend on a backend that sleeps.
#
# WHY IT RUNS HERE and not in the two more obvious homes, both tried, both dead:
#   - A Claude cloud routine cannot. Its Slack connector refuses to post into
#     this channel and misreports the reason as "externally shared".
#   - The backend cannot be relied on. Render's free tier sleeps when idle, so
#     a weekly timer there may not be awake on a Friday evening.
#
# The bot token is what makes the Slack post possible at all. A bot token
# invited to the channel has none of the connector's restrictions. It lives in
# the repository secret SLACK_BOT_TOKEN.

name: AI Sponsor north star to Slack

on:
  schedule:
    # 20:00 UTC Friday = 3pm for Matt (US Central), 10pm Europe.
    # His afternoon on purpose, since he is the one watching it.
    - cron: "0 20 * * 5"
  workflow_dispatch: {}   # so it can be run by hand without waiting for Friday

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post the nudge to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Moved from #ai-sponsor (C0B2BEYJBAN) on 2 Sep 2026. Matt: "lets run
          # the automation into this channel so all data/users/metrics are
          # isolated into this channel". #ai-sponsor is also a Slack Connect
          # channel with external people in it; this one is internal, and the
          # bot already posts the live signup alerts here so it is invited.
          CHANNEL: C0BQYBMJPP0          # #ai-sponsor-updates
          DASHBOARD: https://guru-labs-ai.github.io/Company-Brain/ai-sponsor-northstar.html
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime

          token   = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["CHANNEL"]
          board   = os.environ["DASHBOARD"]

          if not token:
              raise SystemExit("SLACK_BOT_TOKEN is empty. Set it in Settings, "
                               "Secrets and variables, Actions.")

          today = datetime.date.today()
          week  = f"{today.day} {today.strftime('%B')}"

          text = (f"*AI Sponsor north star, week ending {week}*\n\n"
                  f"Days of recovery, live and counting: {board}")

          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps({"channel": channel,
                               "text": text,
                               "unfurl_links": False}).encode(),
              headers={"Authorization": f"Bearer {token}",
                       "Content-type": "application/json; charset=utf-8"},
          )
          res = json.load(urllib.request.urlopen(req))
          print(json.dumps(res)[:300])

          # Fail loudly. A silent failure is the worst outcome here: this post
          # looked like it was working for days while nothing was scheduled.
          if not res.get("ok"):
              raise SystemExit(f"Slack refused the post: {res.get('error')}")
          PY
